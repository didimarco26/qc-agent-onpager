<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>代理商每日消耗跟踪一页纸｜陈日晖</title>
<script src="echarts.min.js"></script>
<style>
:root{
  /* Palette */
  --primary:#2563eb; --primary-d:#1e40af; --primary-l:#eff6ff;
  --indigo:#4f46e5;
  --ink:#0f172a; --ink-2:#334155; --sub:#64748b; --sub-2:#94a3b8;
  --line:#e8edf5; --line-2:#f1f5fb;
  --red:#e11d48; --red-l:#fff1f2;
  --amber:#d97706; --amber-l:#fffbeb;
  --green:#059669; --green-l:#ecfdf5;
  --card:#ffffff; --bg:#f3f5fa;
  --shadow:0 2px 12px rgba(15,23,42,.05);
  --shadow-h:0 8px 24px rgba(37,99,235,.16);
  --r-lg:18px; --r-md:13px; --r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
}
.app{max-width:1280px;margin:0 auto;padding:0 24px 48px}

/* ---------- Tabs ---------- */
.tabs{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;gap:6px;padding:10px 24px;margin:0 -24px;overflow-x:auto}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#f8fafc;color:var(--sub);
  padding:8px 18px;border-radius:22px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:.18s}
.tab:hover{border-color:var(--primary);color:var(--primary)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.3)}
.tools{margin-left:auto;flex:0 0 auto;display:flex;align-items:center;gap:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 16px;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}

/* ---------- Page / grid ---------- */
.page{padding-top:24px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}
.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}

/* ---------- Header ---------- */
.hdr{grid-column:span 12;border-radius:var(--r-lg);padding:28px 34px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(115deg,#172554 0%,#1e3a8a 38%,#2563eb 78%,#3b82f6 100%);
  box-shadow:var(--shadow-h);display:flex;justify-content:space-between;align-items:flex-start}
.hdr::after{content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.14),transparent 70%)}
.hdr h1{font-size:27px;font-weight:800;letter-spacing:.6px;position:relative}
.hdr .tagline{margin-top:9px;font-size:13.5px;color:#c7d8ff;font-weight:500;position:relative}
.hdr .meta{text-align:right;font-size:12.5px;color:#d4e1ff;line-height:2;position:relative}
.hdr .meta b{color:#fff;font-size:14.5px}
.pill{display:inline-block;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);
  border-radius:7px;padding:2px 10px;margin-left:7px;font-size:11.5px;font-weight:600}

/* ---------- Section / card ---------- */
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px 26px;box-shadow:var(--shadow)}
.sec-t{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:18px}
.sec-t .bar{width:5px;height:19px;border-radius:3px;background:var(--primary)}
.sec-t .hint{font-size:12px;font-weight:500;color:var(--sub);margin-left:auto}
.sec-t .ico{font-size:18px}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.kpi{border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fcfdff,#f5f8ff)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);opacity:.85}
.kpi .l{font-size:12px;color:var(--sub);font-weight:600}
.kpi .v{font-size:23px;font-weight:800;margin-top:7px;letter-spacing:-.6px}
.kpi .v small{font-size:11.5px;font-weight:600;color:var(--sub);margin-left:2px}
.kpi .d{font-size:11.5px;margin-top:5px;font-weight:600}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:var(--sub)}

/* ---------- Double11 ---------- */
.d11{background:linear-gradient(180deg,#fff6f4,#fff);border:1px solid #f7d9d3}
.d11 .sec-t .bar{background:var(--red)}
.d11-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.d11-card{border-radius:var(--r-md);padding:17px 19px;border:1px solid var(--line);background:#fff}
.d11-card .l{font-size:12.5px;color:var(--sub);font-weight:600}
.d11-card .v{font-size:29px;font-weight:800;margin-top:8px;letter-spacing:-1px}
.d11-card .v small{font-size:13px;color:var(--sub);font-weight:600}
.d11-card .s{font-size:12px;color:var(--sub);margin-top:6px}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12.5px;font-weight:800;margin-top:9px}
.badge.pos{background:var(--red-l);color:var(--red)}
.badge.neg{background:var(--green-l);color:var(--green)}
.todo{border:1px dashed #f0b8b0;background:var(--red-l);border-radius:var(--r-md);padding:17px 19px;
  display:flex;flex-direction:column;justify-content:center}
.todo .l{font-size:12.5px;color:var(--red);font-weight:700}
.todo .s{font-size:12px;color:#b4574e;margin-top:6px}
.d11-note{margin-top:15px;font-size:12.5px;color:#9f1239;background:var(--red-l);border-radius:10px;
  padding:11px 15px;font-weight:500}

/* ---------- Chart ---------- */
.chart-box{height:320px;width:100%}
.chart-sum{display:flex;gap:26px;font-size:12.5px;color:var(--sub);margin-bottom:8px;font-weight:600}
.chart-sum b{color:var(--ink)}

/* ---------- T-1 customer board ---------- */
.t1{background:linear-gradient(180deg,#f8faff,#fff);border:1px solid #dce6ff}
.t1 .sec-t .bar{background:var(--indigo)}
.t1-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.t1-col{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:#fff}
.t1-col .ch{padding:10px 14px;font-size:13px;font-weight:800;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px}
.t1-col.spend .ch{background:#eef2ff;color:#3730a3}
.t1-col.gain .ch{background:var(--red-l);color:#be123c}
.t1-col.loss .ch{background:var(--green-l);color:#047857}
.t1-list{list-style:none}
.t1-list li{display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line-2);font-size:12.5px}
.t1-list li:last-child{border-bottom:none}
.rk{flex:0 0 20px;height:20px;border-radius:6px;background:#f1f5f9;color:var(--sub);font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.t1-list li:nth-child(1) .rk{background:#fde68a;color:#92400e}
.t1-list li:nth-child(2) .rk{background:#e2e8f0;color:#475569}
.t1-list li:nth-child(3) .rk{background:#fcd9b8;color:#9a3412}
.t1-list .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.t1-list .vl{font-weight:800;white-space:nowrap}
.t1-empty{padding:22px;text-align:center;color:var(--sub-2);font-size:12px}

/* ---------- Goals ---------- */
.goal{margin-bottom:18px}
.goal:last-child{margin-bottom:0}
.goal-row{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:7px}
.goal-row .g{color:var(--sub);font-weight:600}
.track{height:12px;border-radius:7px;background:#eef1f7;overflow:hidden}
.fill{height:100%;border-radius:7px;background:linear-gradient(90deg,#3b82f6,#1d4ed8)}
.fill.star{background:linear-gradient(90deg,#8b5cf6,#6d28d9)}
.goal-meta{font-size:11.5px;color:var(--sub);margin-top:6px}

/* ---------- Transfer ---------- */
.lock{display:flex;gap:15px;align-items:center;border:1px solid #f0d6a8;background:var(--amber-l);
  border-radius:var(--r-md);padding:15px 18px}
.lock .ic{font-size:27px}
.lock .t{font-weight:800;font-size:13.5px;color:var(--amber)}
.lock .s{font-size:12.5px;color:#92610c;margin-top:4px}
.tf-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-top:14px}
.tf-mini{border:1px dashed #e2c89a;border-radius:10px;padding:12px;text-align:center;background:#fffdf7}
.tf-mini .l{font-size:11.5px;color:var(--sub)}
.tf-mini .v{font-size:21px;font-weight:800;margin-top:4px;color:#caa15a}
.tf-mini .v small{font-size:11px;color:var(--sub)}
.tf-sub{font-size:12px;color:var(--sub);margin:14px 0 2px;line-height:2}
.tf-sub b{color:var(--ink)}

/* ---------- Wallet ---------- */
.wallet{background:linear-gradient(180deg,#f5f7ff,#fff);border:1px solid #d7e3ff}
.wallet .sec-t .bar{background:var(--indigo)}
.wallet-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.wl-card{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:#fff}
.wl-card .wt{font-size:13.5px;font-weight:800;display:flex;align-items:center}
.wl-card .ws{font-size:11.5px;color:var(--sub);margin:4px 0 11px}
.wl-big{display:flex;gap:28px;margin:3px 0 7px}
.wl-big .l{font-size:11px;color:var(--sub)}
.wl-big .v{font-size:23px;font-weight:800;color:var(--primary-d);letter-spacing:-.5px}
.wl-big .v small{font-size:11px;color:var(--sub)}
.penbar{display:inline-block;vertical-align:middle;height:7px;width:66px;border-radius:4px;background:#eef1f6;
  overflow:hidden;position:relative;margin-right:6px}
.penbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6366f1,#4338ca)}

/* ---------- mini table ---------- */
.minitable{width:100%;border-collapse:collapse;margin-top:11px;font-size:12px}
.minitable th{text-align:left;color:var(--sub);font-weight:600;padding:7px 6px;border-bottom:1px solid var(--line)}
.minitable td{padding:7px 6px;border-bottom:1px solid var(--line-2)}
.minitable td.r,.minitable th.r{text-align:right;white-space:nowrap}
.minitable .nm{max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- footer ---------- */
.foot{grid-column:span 12;font-size:11.5px;color:var(--sub);margin-top:2px;padding:0 4px;line-height:1.9}
.foot b{color:var(--ink-2)}

/* export full-list button */
.xbtn{margin-left:auto;border:1px solid #c7d4f5;background:#f4f7ff;color:#3955b8;border-radius:7px;
  padding:3px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.xbtn:hover{background:#2563eb;color:#fff;border-color:#2563eb}
.xbtn.dark{border-color:#d8c49a;background:#fffdf2;color:#926a1c}
.xbtn.dark:hover{background:#d97706;color:#fff;border-color:#d97706}

@media print{
  body{background:#fff}
  .tabs,.tools{display:none!important}
  .page{padding:0}
  .sec,.hdr{box-shadow:none;break-inside:avoid}
  .app{max-width:100%;padding:0}
}
</style>
</head>
<body>
<div class="app">
  <div class="tabs" id="tabs"></div>
  <div id="pageRoot"></div>
</div>
<script src="app.js"></script>
</body>
</html>
